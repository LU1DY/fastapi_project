[project]
name = "fast-api-projeto"
version = "0.1.0"
description = ""
authors = [
    {name = "Luidy-Michael",email = "luidymichael8@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)"
]

[tool.poetry]
packages = [{include = "fast_api_projeto", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = "ruff check"
format = "ruff format"
run = "fastapi dev src/fast_api_projeto/app.py"
test = "pytest -x -s --cov=fast_api_projeto -vv"
post_test = "coverage html"
pre_test = "task lint"
pre_format = "ruff check --fix"